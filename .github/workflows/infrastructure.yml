name: Infrastructure validation

# Terraform state is intentionally local for this Free Plan stack, and the CI
# role deliberately holds no permission to create a VPC, an RDS instance or an
# IAM role. So CI validates both roots and never pretends it can plan or apply
# without the operator's state.
#
# Provision once with deploy-aws-student.ps1/.sh. After that, deploy.yml owns
# every deployment: images, all three Lambda functions, the Keycloak rollout,
# the warehouse load and the console.

on:
  push:
    branches: [main, master]
    paths:
      - "infrastructure/aws/**"
      - ".github/workflows/infrastructure.yml"
  pull_request:
    paths:
      - "infrastructure/aws/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infrastructure/aws/bootstrap
          - infrastructure/aws
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check -diff

      - name: Init without backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false

      - name: Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate
