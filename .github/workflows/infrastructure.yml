name: Infrastructure validation

# Terraform state is intentionally local for this Free Plan stack. CI therefore
# validates both roots but never pretends it can safely plan/apply without the
# operator's state. Provision with deploy-aws-student.ps1/.sh; backend.yml owns
# repeatable image and Keycloak rollouts after that first deployment.

on:
  push:
    branches: [main, master]
    paths:
      - "infrastructure/aws/**"
      - ".github/workflows/infrastructure.yml"
  pull_request:
    paths:
      - "infrastructure/aws/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infrastructure/aws/bootstrap
          - infrastructure/aws
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check -diff

      - name: Init without backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false

      - name: Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate
