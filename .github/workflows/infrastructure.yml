name: Infrastructure

# Terraform validation on every change; apply only when a human asks.
#
# The asymmetry is deliberate. `plan` is free and safe, so it runs automatically
# and posts what would change. `apply` creates billable resources on a finite
# student credit, so it is workflow_dispatch with a typed confirmation -- an
# infrastructure change that reaches production because someone merged a branch
# is the failure mode this guards against.
#
# `destroy` is here too, gated harder, because the ability to tear the stack
# down is the most important cost control in the repository.

on:
  push:
    branches: [main, master]
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"
  pull_request:
    paths:
      - "infrastructure/**"
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm:
        description: "Type the environment name (student) to allow apply/destroy"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_DIR: infrastructure/terraform
  TF_VERSION: "1.9.8"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Formatting and validation need no cloud credentials, so they run on
      # forks and pull requests where the Azure login would fail.
      - name: Format
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive -diff

      - name: Init (no backend)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false

      - name: Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

  plan:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production-demo
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Plan
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_ai_api_key: ${{ secrets.TRANSFEROPS_AI_API_KEY }}
          TF_VAR_budget_alert_emails: '["${{ vars.BUDGET_ALERT_EMAIL }}"]'
        run: |
          terraform init
          terraform plan -no-color -input=false

  apply:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: production-demo
    steps:
      - name: Require confirmation
        # A dropdown alone is one mis-click. The typed value is the second hand.
        if: inputs.confirm != 'student'
        run: |
          echo "::error::Type 'student' in the confirm field to apply."
          exit 1

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_ai_api_key: ${{ secrets.TRANSFEROPS_AI_API_KEY }}
          TF_VAR_budget_alert_emails: '["${{ vars.BUDGET_ALERT_EMAIL }}"]'
        run: |
          terraform init
          terraform apply -auto-approve -input=false

      - name: What this now costs
        working-directory: ${{ env.TF_DIR }}
        run: terraform output -raw cost_posture

  destroy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: production-demo
    steps:
      - name: Require confirmation
        if: inputs.confirm != 'student'
        run: |
          echo "::error::Type 'student' in the confirm field to destroy."
          exit 1

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Destroy
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init
          terraform destroy -auto-approve -input=false
