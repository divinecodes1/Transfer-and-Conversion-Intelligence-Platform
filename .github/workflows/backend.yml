name: Backend

# Test, build, push to ECR, roll the Lambda functions.
#
# Unlike the previous Azure deployment, this one actually deploys. Federated
# login on AWS is an IAM OIDC provider and a role inside the account, created by
# the same credentials that create everything else -- no directory administrator,
# no tenant policy. There is still no stored access key: GitHub mints a
# short-lived token scoped to this repository and environment.
#
# The gates run BEFORE the image is built, not after it is deployed. This repo's
# whole argument is that a metric is trustworthy because something proves it
# reconciles; shipping an image whose golden gate failed would make the badge a
# decoration.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "aws/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after building"
        type: boolean
        default: true
      seed_warehouse:
        description: "Reload the deployed warehouse (drops entitlements granted since the last load)"
        type: boolean
        default: false
  # Called by deploy.yml, which runs this and then the console in one ordered
  # run. The inputs are the same ones workflow_dispatch offers.
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: true
      seed_warehouse:
        type: boolean
        default: false

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # required to request the OIDC token
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q ai api agent bi etl observability tests

      - name: Build the warehouse
        run: |
          python etl/generate_data.py
          python etl/run.py --engine duckdb

      - name: Golden-project reconciliation
        run: python tests/golden_projects.py
      - name: Metric governance
        run: python tests/governance_checks.py
      - name: Mart layer
        run: python tests/mart_checks.py
      - name: Readiness, network and similarity
        run: python tests/readiness_checks.py
      - name: AI layer boundaries
        run: python tests/ai_checks.py
      - name: Console isolation
        run: python tests/web_checks.py

      # Proves the platform still works with no model configured, which is what
      # makes mock a supported deployment mode rather than an untested fallback.
      - name: AI degrades without a provider
        env:
          TRANSFEROPS_AI_PROVIDER: mock
        run: python -c "from ai import gateway; assert gateway.configured(); print('mock needs no credential')"

  deploy:
    needs: test
    # Gated on a repository VARIABLE, not a secret: job-level `if:` cannot read
    # the secrets context, so a missing secret would fail inside the job rather
    # than skip it.
    if: vars.AWS_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    environment: production-demo
    steps:
      # Full history, because the warehouse-load decision below compares this
      # commit against the previous one. A shallow clone has no such base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No access key. The role's trust policy accepts only a token whose
      # subject matches this repository and the production-demo environment.
      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the API image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.AWS_ECR_API_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Two stages. The base image is the same one that runs locally and in
          # the Kubernetes manifests; the Lambda image adds only the Web Adapter
          # on top, so the deployed artefact and the local one cannot diverge in
          # anything but packaging.
          docker build -t transfer-intelligence:base .
          docker build \
            -f infrastructure/docker/lambda/Dockerfile \
            --build-arg BASE_IMAGE=transfer-intelligence:base \
            -t "$REGISTRY/$REPOSITORY:$TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Build and push the Keycloak image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.AWS_ECR_KEYCLOAK_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Realm and themes are baked in: EC2 has no bind mount from a laptop,
          # so an image without them boots with no realm and authenticates
          # nobody. Built on every push so the realm cannot drift from the code.
          docker build \
            -f infrastructure/docker/keycloak/Dockerfile \
            -t "$REGISTRY/$REPOSITORY:$TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Roll the Lambda functions
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.AWS_ECR_API_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPOSITORY:$TAG"
          for fn in "${{ secrets.AWS_API_FUNCTION }}" "${{ secrets.AWS_ASSISTANT_FUNCTION }}" "${{ secrets.AWS_REFRESH_FUNCTION }}"; do
            [ -n "$fn" ] || continue
            aws lambda update-function-code --function-name "$fn" --image-uri "$IMAGE" >/dev/null
            # The next update is rejected while the previous one is in progress,
            # so the two functions cannot be rolled back to back without this.
            aws lambda wait function-updated --function-name "$fn"
            echo "$fn -> $IMAGE"
          done

      - name: Roll Keycloak through SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.AWS_ECR_KEYCLOAK_REPOSITORY }}
          TAG: ${{ github.sha }}
          INSTANCE: ${{ secrets.AWS_KEYCLOAK_INSTANCE }}
          DOCUMENT: ${{ secrets.AWS_KEYCLOAK_ROLLOUT_DOCUMENT }}
          PUBLIC_URL: ${{ vars.AWS_KEYCLOAK_URL }}
        run: |
          set -euo pipefail
          COMMAND=$(aws ssm send-command --instance-ids "$INSTANCE" \
            --document-name "$DOCUMENT" \
            --parameters "ImageUri=$REGISTRY/$REPOSITORY:$TAG,PublicUrl=$PUBLIC_URL" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND" --instance-id "$INSTANCE"
          aws ssm get-command-invocation --command-id "$COMMAND" --instance-id "$INSTANCE" \
            --query '{Status:Status,Output:StandardOutputContent}' --output table

      - name: Smoke test
        env:
          API_URL: ${{ vars.AWS_API_URL }}
        run: |
          set -euo pipefail
          [ -n "$API_URL" ] || { echo "AWS_API_URL not set; skipping"; exit 0; }
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${API_URL%/}/healthz" || true)
            # 200 means up. 503 means the function is running but cannot reach
            # the warehouse, which is a different failure and worth surfacing.
            if [ "$code" = "200" ]; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code:-none}"
            sleep 6
          done
          echo "::error::API did not become healthy at ${API_URL%/}/healthz"
          exit 1
