name: Backend

# Test, build, push to ECR, roll the Lambda functions.
#
# Unlike the previous Azure deployment, this one actually deploys. Federated
# login on AWS is an IAM OIDC provider and a role inside the account, created by
# the same credentials that create everything else -- no directory administrator,
# no tenant policy. There is still no stored access key: GitHub mints a
# short-lived token scoped to this repository and environment.
#
# The gates run BEFORE the image is built, not after it is deployed. This repo's
# whole argument is that a metric is trustworthy because something proves it
# reconciles; shipping an image whose golden gate failed would make the badge a
# decoration.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "aws/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after building"
        type: boolean
        default: true
      seed_warehouse:
        description: "Reload the deployed warehouse (drops entitlements granted since the last load)"
        type: boolean
        default: false
  # Called by deploy.yml, which runs this and then the console in one ordered
  # run. The inputs are the same ones workflow_dispatch offers.
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: true
      seed_warehouse:
        type: boolean
        default: false

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # required to request the OIDC token
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q ai api agent bi etl observability tests

      - name: Build the warehouse
        run: |
          python etl/generate_data.py
          python etl/run.py --engine duckdb

      - name: Golden-project reconciliation
        run: python tests/golden_projects.py
      - name: Metric governance
        run: python tests/governance_checks.py
      - name: Mart layer
        run: python tests/mart_checks.py
      - name: Readiness, network and similarity
        run: python tests/readiness_checks.py
      - name: AI layer boundaries
        run: python tests/ai_checks.py
      - name: Console isolation
        run: python tests/web_checks.py

      # Proves the platform still works with no model configured, which is what
      # makes mock a supported deployment mode rather than an untested fallback.
      - name: AI degrades without a provider
        env:
          TRANSFEROPS_AI_PROVIDER: mock
        run: python -c "from ai import gateway; assert gateway.configured(); print('mock needs no credential')"

  deploy:
    needs: test
    # Gated on a repository VARIABLE, not a secret: job-level `if:` cannot read
    # the secrets context, so a missing secret would fail inside the job rather
    # than skip it.
    if: vars.AWS_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    environment: production-demo
    steps:
      # Full history, because the warehouse-load decision below compares this
      # commit against the previous one. A shallow clone has no such base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No access key. The role's trust policy accepts only a token whose
      # subject matches this repository and the production-demo environment.
      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the API image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.AWS_ECR_API_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Two stages. The base image is the same one that runs locally and in
          # the Kubernetes manifests; the Lambda image adds only the Web Adapter
          # on top, so the deployed artefact and the local one cannot diverge in
          # anything but packaging.
          docker build -t transfer-intelligence:base .
          docker build \
            -f infrastructure/docker/lambda/Dockerfile \
            --build-arg BASE_IMAGE=transfer-intelligence:base \
            -t "$REGISTRY/$REPOSITORY:$TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Build and push the Keycloak image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.AWS_ECR_KEYCLOAK_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Realm and themes are baked in: EC2 has no bind mount from a laptop,
          # so an image without them boots with no realm and authenticates
          # nobody. Built on every push so the realm cannot drift from the code.
          docker build \
            -f infrastructure/docker/keycloak/Dockerfile \
            -t "$REGISTRY/$REPOSITORY:$TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      # One helper for both SSM documents below, because the naive version has
      # two failure modes worth avoiding.
      #
      #   * `aws ssm wait command-executed` exits non-zero when the command
      #     fails, and under `set -e` that aborts the step before anything is
      #     printed -- a failed deploy with no reason on screen.
      #   * That waiter also gives up after ~100 seconds. The Keycloak rollout
      #     pulls an image and restarts a JVM; the warehouse load pulls an image
      #     and runs the whole ETL. Both routinely take longer, and the waiter
      #     would report failure on a command that was still running.
      #
      # So: poll to an explicit deadline, always print, then decide.
      - name: Install the SSM runner
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ssm-run.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          instance="$1"; document="$2"; parameters="$3"; timeout="${4:-600}"

          id=$(aws ssm send-command --instance-ids "$instance" \
                 --document-name "$document" --parameters "$parameters" \
                 --query 'Command.CommandId' --output text) || exit 1
          echo "$document -> command $id (waiting up to ${timeout}s)"

          # get-command-invocation reports InvocationDoesNotExist for a moment
          # after send-command returns, which is not an error.
          status=Pending
          deadline=$(( SECONDS + timeout ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(aws ssm get-command-invocation --command-id "$id" \
                       --instance-id "$instance" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
            --query StandardOutputContent --output text || true
          if [ "$status" != "Success" ]; then
            echo "--- stderr ---"
            aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
              --query StandardErrorContent --output text || true
            echo "::error::$document finished with status $status"
            exit 1
          fi
          echo "$document: Success"
          SCRIPT
          chmod +x "$RUNNER_TEMP/ssm-run.sh"

      # Resolved by tag, not by a pinned id. Any change to the host's user_data
      # replaces the instance, and an id published to a repository secret then
      # names a terminated one. SendCommand fails with AccessDenied -- because
      # the role is authorised for the *new* instance while CI asks about the
      # old -- so the error names IAM and the cause is a stale secret.
      #
      # AWS_KEYCLOAK_INSTANCE remains the fallback so a repository configured
      # before this step existed still deploys.
      - name: Resolve the Keycloak host
        id: host
        env:
          NAME_TAG: ${{ vars.AWS_KEYCLOAK_NAME_TAG }}
          FALLBACK: ${{ secrets.AWS_KEYCLOAK_INSTANCE }}
        run: |
          set -euo pipefail
          instance=""
          if [ -n "${NAME_TAG:-}" ]; then
            instance=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=$NAME_TAG" \
                        "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].InstanceId' --output text)
          fi
          # More than one match means an ambiguous target; refuse rather than
          # roll a host at random.
          count=$(printf '%s' "$instance" | wc -w)
          if [ "$count" -gt 1 ]; then
            echo "::error::tag '$NAME_TAG' matches $count running instances: $instance"
            exit 1
          fi
          if [ -z "$instance" ]; then
            echo "no running instance tagged '${NAME_TAG:-<unset>}'; using AWS_KEYCLOAK_INSTANCE"
            instance="$FALLBACK"
          fi
          [ -n "$instance" ] || {
            echo "::error::could not determine the Keycloak host. Re-run scripts/setup-github-actions.sh."
            exit 1
          }
          echo "instance=$instance" >> "$GITHUB_OUTPUT"

      - name: Roll Keycloak through SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.AWS_ECR_KEYCLOAK_REPOSITORY }}
          TAG: ${{ github.sha }}
          INSTANCE: ${{ steps.host.outputs.instance }}
          DOCUMENT: ${{ secrets.AWS_KEYCLOAK_ROLLOUT_DOCUMENT }}
          PUBLIC_URL: ${{ vars.AWS_KEYCLOAK_URL }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ssm-run.sh" "$INSTANCE" "$DOCUMENT" \
            "ImageUri=$REGISTRY/$REPOSITORY:$TAG,PublicUrl=$PUBLIC_URL" 900

      # ---- The warehouse ------------------------------------------------------
      #
      # Deploying code without deploying the schema it queries is how a green
      # pipeline produces a broken console. RDS is private and has no public
      # address, so a runner cannot reach it directly; the load runs inside the
      # VPC on the Keycloak/NAT host, from the image that was just pushed and
      # tested, through a fixed SSM document that accepts an image URI and
      # nothing else.
      #
      # Not on every push, because a load rebuilds the warehouse and drops any
      # tr_gov entitlement granted since the last one. Only when the schema or
      # the pipeline actually changed -- or when asked.
      - name: Decide whether the warehouse needs loading
        id: decision
        env:
          REQUESTED: ${{ inputs.seed_warehouse }}
          BEFORE: ${{ github.event.before }}
          CURRENT: ${{ github.sha }}
        run: |
          set -euo pipefail
          decide() {
            if [ "${REQUESTED:-false}" = "true" ]; then
              echo "requested explicitly"; return 0
            fi
            # A first push, a force-push or a re-run can leave no usable base.
            # The load is deterministic and idempotent, so when the diff cannot
            # be computed the safe answer is to load rather than to skip.
            if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "no previous commit to compare against"; return 0
            fi
            if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              echo "previous commit ${BEFORE} is not in this clone"; return 0
            fi
            if git diff --name-only "$BEFORE" "$CURRENT" | grep -Eq '^(sql|etl)/'; then
              echo "sql/ or etl/ changed"; return 0
            fi
            return 1
          }
          if reason=$(decide); then
            echo "seed=true" >> "$GITHUB_OUTPUT"
            echo "Loading the warehouse: ${reason}."
          else
            echo "seed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the warehouse load: no change under sql/ or etl/."
          fi

      - name: Load the warehouse through SSM
        if: steps.decision.outputs.seed == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.AWS_ECR_API_REPOSITORY }}
          TAG: ${{ github.sha }}
          INSTANCE: ${{ steps.host.outputs.instance }}
          DOCUMENT: ${{ secrets.AWS_WAREHOUSE_SEED_DOCUMENT }}
          # A reload drops the tr_gov entitlements. Naming the operator here
          # re-grants the demo account in the same command, so the console shows
          # data instead of an empty, correctly-enforced scope.
          OPERATOR: ${{ vars.TRANSFEROPS_OPERATOR }}
        run: |
          set -euo pipefail
          [ -n "$DOCUMENT" ] || {
            echo "::error::AWS_WAREHOUSE_SEED_DOCUMENT is not set. Re-run scripts/setup-github-actions.sh."
            exit 1
          }
          PARAMETERS="ImageUri=$REGISTRY/$REPOSITORY:$TAG"
          # An `[ ... ] && ...` one-liner would return 1 when the operator is
          # unset and abort the step under `set -e`.
          if [ -n "${OPERATOR:-}" ]; then
            PARAMETERS="$PARAMETERS,Operator=$OPERATOR"
          fi
          # The ETL pulls the image, generates the portfolio and runs every
          # data-quality gate; the document's own ceiling is 1800s.
          #
          # The output is captured as well as printed so the loaded row count can
          # be asserted here. A warehouse with no projects in it is a successful
          # deployment of nothing, and every screen in the console would be empty.
          # This is the right place for that check: the deploy-time verification
          # holds no credentials, and /health is entitlement-scoped and refuses
          # an anonymous caller under enforce.
          output=$("$RUNNER_TEMP/ssm-run.sh" "$INSTANCE" "$DOCUMENT" "$PARAMETERS" 1800 | tee /dev/stderr)
          projects=$(printf '%s' "$output" \
            | sed -n 's/.*Loaded warehouse (postgres): \([0-9][0-9]*\) projects.*/\1/p' | tail -1)
          if [ -z "$projects" ] || [ "$projects" -eq 0 ]; then
            echo "::error::the warehouse load reported no projects"
            exit 1
          fi
          echo "warehouse loaded with $projects projects"

      # Last, and deliberately after the warehouse load above.
      #
      # Rolling the functions first would put code that expects a new column
      # live against a database that does not have it yet, and every request in
      # that window fails. Loading first means the only overlap is the old code
      # against the new schema, which additive changes tolerate.
      - name: Roll the Lambda functions
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.AWS_ECR_API_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPOSITORY:$TAG"
          for fn in "${{ secrets.AWS_API_FUNCTION }}" "${{ secrets.AWS_ASSISTANT_FUNCTION }}" "${{ secrets.AWS_REFRESH_FUNCTION }}"; do
            [ -n "$fn" ] || continue
            aws lambda update-function-code --function-name "$fn" --image-uri "$IMAGE" >/dev/null
            # The next update is rejected while the previous one is in progress,
            # so the two functions cannot be rolled back to back without this.
            aws lambda wait function-updated --function-name "$fn"
            echo "$fn -> $IMAGE"
          done

      # /health is the right probe here, not /healthz: it does a real query
      # against tr_core and returns the row count and the warehouse vintage. A
      # 200 therefore proves the whole chain in one call -- the function is
      # running, it reached RDS across the private subnet through the NAT
      # instance, and the warehouse actually has data in it.
      #
      # 503 means the function is up but cannot see the warehouse, which is a
      # different bug from a function that will not start, so both are reported.
      - name: Smoke test
        id: smoke
        env:
          API_URL: ${{ vars.AWS_API_URL }}
        run: |
          set -euo pipefail
          [ -n "$API_URL" ] || { echo "AWS_API_URL not set; skipping"; exit 0; }
          # /healthz, not /health: /health resolves an identity and refuses an
          # anonymous caller under enforce, so this loop would retry 12 times and
          # then fail against a perfectly healthy deployment. The row count it
          # used to prove is asserted at the warehouse load above, where
          # credentials already exist.
          URL="${API_URL%/}/healthz"
          for attempt in $(seq 1 12); do
            body=$(curl -s --max-time 25 -w '\n%{http_code}' "$URL" || true)
            code=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')
            if [ "$code" = "200" ]; then
              echo "healthy after ${attempt} attempt(s): $payload"
              # A stray newline in a step output silently corrupts the file.
              echo "health=$(printf '%s' "$payload" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code:-none} ${payload:-}"
            sleep 10
          done
          echo "::error::API did not become healthy at ${URL}"
          exit 1

      - name: Summary
        if: always()
        env:
          CONSOLE_URL: ${{ vars.AWS_CONSOLE_URL }}
          API_URL: ${{ vars.AWS_API_URL }}
          KEYCLOAK_URL: ${{ vars.AWS_KEYCLOAK_URL }}
          SEEDED: ${{ steps.decision.outputs.seed }}
          HEALTH: ${{ steps.smoke.outputs.health }}
        run: |
          {
            echo "### Backend deployed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image tag | \`${{ github.sha }}\` |"
            echo "| Warehouse reloaded | ${SEEDED:-false} |"
            echo "| Health | ${HEALTH:-not checked} |"
            echo "| Console | ${CONSOLE_URL:-—} |"
            echo "| API | ${API_URL:-—} |"
            echo "| Keycloak | ${KEYCLOAK_URL:-—} |"
          } >> "$GITHUB_STEP_SUMMARY"
