name: Frontend

# Build the console and publish it to Azure Static Web Apps.
#
# The console is a Vite SPA -- static files, no server runtime. That is why
# Static Web Apps Free is the right host and why nothing here needs to scale or
# wake up: the page paints immediately even while the API is cold-starting, and
# the Free tier includes a managed certificate and 100 GB/month of bandwidth.
#
# Everything under VITE_* is compiled into the bundle and is therefore PUBLIC.
# Only values that are safe in a browser appear below: the API's own URL, the
# Keycloak realm, and the public OIDC client id. No model key and no connection
# string is a build input -- tests/web_checks.py asserts the built source holds
# neither.

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      # Typecheck and build. What CI can prove cheaply is that the console
      # compiles against the API types it claims to consume; it cannot prove a
      # chart looks right, so it does not pretend to.
      - name: Typecheck and build
        working-directory: web
        env:
          VITE_TRANSFEROPS_API: ${{ vars.VITE_TRANSFEROPS_API }}
          VITE_TRANSFEROPS_AGENT: ${{ vars.VITE_TRANSFEROPS_AGENT }}
          VITE_KEYCLOAK_URL: ${{ vars.VITE_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: ${{ vars.VITE_KEYCLOAK_REALM }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ vars.VITE_KEYCLOAK_CLIENT_ID }}
          VITE_TRANSFEROPS_AUTH: ${{ vars.VITE_TRANSFEROPS_AUTH }}
        run: npm run build

      # The console must not carry SQL, credentials, metric definitions or
      # banding thresholds. Run on every frontend change, because that is
      # exactly when someone is most tempted to compute a percentile in a
      # component.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Console isolation gate
        run: python tests/web_checks.py

      - uses: actions/upload-artifact@v4
        with:
          name: console
          path: web/dist
          retention-days: 5

  deploy:
    needs: build
    # Pull requests build and gate but do not publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production-demo
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: console
          path: dist

      # Federated OIDC, no stored client secret. scripts/setup-github-actions.sh
      # creates the app registration and the credential.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The console is served from the storage account's static website, so
      # publishing is an upload into the $web container.
      #
      # --auth-mode login is required, not preferred: the account has
      # shared_access_key_enabled = false, so there is no account key to use.
      # Uploads authenticate as the CI identity, which holds Storage Blob Data
      # Contributor on this one account and nothing else.
      - name: Publish the console
        run: |
          set -euo pipefail
          az storage blob upload-batch \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --auth-mode login \
            --destination '$web' \
            --source dist \
            --overwrite \
            --output none
          echo "Uploaded $(find dist -type f | wc -l) files to \$web"

      # Hashed asset filenames make the bundle safe to cache hard, but
      # index.html must not be: a cached index keeps pointing at the previous
      # bundle and the deploy appears to do nothing.
      - name: Keep index.html uncacheable
        run: |
          set -euo pipefail
          az storage blob update \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --auth-mode login \
            --container-name '$web' \
            --name index.html \
            --content-cache-control "no-cache, must-revalidate" \
            --output none

      - name: Smoke test
        run: |
          set -euo pipefail
          URL="$(az storage account show \
            --name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --query primaryEndpoints.web -o tsv)"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || true)
          [ "$code" = "200" ] || { echo "::error::console returned $code at $URL"; exit 1; }
          echo "console live at $URL"
