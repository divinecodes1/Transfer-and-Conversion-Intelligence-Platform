name: Frontend

# Build the console and publish it to S3 behind CloudFront.
#
# The console is a Vite SPA -- static files, no server runtime -- which is why
# S3 + CloudFront is an exact fit rather than a compromise. Usage remains small
# for a demo and is covered by the stack's gross-cost budgets.
#
# Everything under VITE_* is compiled into the bundle and is therefore PUBLIC.
# Only values safe in a browser appear below. tests/web_checks.py asserts the
# built console carries no SQL, no credential and no metric definition.

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:
  # Called by deploy.yml so the console is published after the API it talks to.
  workflow_call:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Typecheck and build
        working-directory: web
        env:
          VITE_TRANSFEROPS_API: ${{ vars.VITE_TRANSFEROPS_API }}
          VITE_TRANSFEROPS_AGENT: ${{ vars.VITE_TRANSFEROPS_AGENT }}
          VITE_KEYCLOAK_URL: ${{ vars.VITE_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: ${{ vars.VITE_KEYCLOAK_REALM }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ vars.VITE_KEYCLOAK_CLIENT_ID }}
          VITE_TRANSFEROPS_AUTH: ${{ vars.VITE_TRANSFEROPS_AUTH }}
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Run on every frontend change, because that is exactly when someone is
      # most tempted to compute a percentile in a component.
      - name: Console isolation gate
        run: python tests/web_checks.py

      - uses: actions/upload-artifact@v4
        with:
          name: console
          path: web/dist
          retention-days: 5

  deploy:
    needs: build
    if: vars.AWS_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production-demo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: console
          path: dist

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Two passes, because the two kinds of file want opposite cache policies.
      #
      # Vite content-hashes every asset filename, so those are immutable and can
      # be cached for a year. index.html is not hashed -- it is the file that
      # names the new bundle -- so caching it is how a deploy appears to do
      # nothing while the CDN keeps serving yesterday's app.
      - name: Publish hashed assets
        run: |
          set -euo pipefail
          aws s3 sync dist "s3://${{ secrets.AWS_CONSOLE_BUCKET }}" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Publish index.html
        run: |
          set -euo pipefail
          aws s3 cp dist/index.html "s3://${{ secrets.AWS_CONSOLE_BUCKET }}/index.html" \
            --cache-control "no-cache,must-revalidate"

      # Only index.html needs invalidating; the hashed assets are new objects
      # with new names. Invalidating /* would work and would also burn the free
      # 1,000 paths a month faster than necessary.
      - name: Invalidate the CDN
        run: |
          set -euo pipefail
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" \
            --query Invalidation.Id --output text)
          echo "invalidation $ID"

      - name: Smoke test
        env:
          CONSOLE_URL: ${{ vars.AWS_CONSOLE_URL }}
        run: |
          set -euo pipefail
          [ -n "$CONSOLE_URL" ] || { echo "AWS_CONSOLE_URL not set; skipping"; exit 0; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$CONSOLE_URL" || true)
          [ "$code" = "200" ] || { echo "::error::console returned $code at $CONSOLE_URL"; exit 1; }
          echo "console live at $CONSOLE_URL"
