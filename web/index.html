<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transfer &amp; Conversion Intelligence Platform</title>
    <meta
      name="description"
      content="Transfer-project performance reporting over a governed metric layer."
    />
    <script>
      // The enterprise experience is light by default. An explicitly stored
      // user choice is still applied before first paint.
      (function () {
        try {
          var stored = localStorage.getItem("transferops-theme");
          var dark = stored === "dark";
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* private mode: fall through to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
