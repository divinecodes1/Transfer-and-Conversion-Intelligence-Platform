<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transfer &amp; Conversion Intelligence Platform</title>
    <meta
      name="description"
      content="Transfer-project performance reporting over a governed metric layer."
    />
    <script>
      // Applied before first paint, so a dark-mode user never sees a white
      // flash. Reads the stored choice, then the OS preference.
      (function () {
        try {
          var stored = localStorage.getItem("transferops-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* private mode: fall through to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
